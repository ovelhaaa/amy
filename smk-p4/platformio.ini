[platformio]
src_dir = main
default_envs = guition-display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
; Same unit as P4SDM: ROM probe on COM13 confirmed ES rev 1.3, 16 MB.
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[env:guition-display]
board = esp32-p4
board_build.esp-idf.sdkconfig_path = .pio/build/guition-display/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es

[env:guition-link]
extends = env:guition-display
board_build.esp-idf.sdkconfig_path = .pio/build/guition-link/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.link

[env:guition-standalone]
extends = env:guition-display
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone

; Integration candidate: electrical gates remain disabled, old UI env preserved.
[env:guition-standalone-blueprint]
extends = env:guition-standalone
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone-blueprint/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint

; Static capacity candidate. Electrical gates remain disabled.
[env:guition-standalone-blueprint-6]
extends = env:guition-standalone-blueprint
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone-blueprint-6/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices6

; Experimental target; qualify six voices on hardware before flashing eight.
[env:guition-standalone-blueprint-8]
extends = env:guition-standalone-blueprint
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone-blueprint-8/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8

; Audible six-voice candidate for the operator-reconfirmed 0.5 bench wiring.
; Building does not authorize uploading this image.
[env:guition-standalone-blueprint-6-bench]
extends = env:guition-standalone-blueprint-6
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone-blueprint-6-bench/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices6;sdkconfig.defaults.bench06

; Audible experimental eight-voice candidate after six-voice hardware PASS.
; Uses the same operator-reconfirmed bench wiring; uploading needs own approval.
[env:guition-standalone-blueprint-8-bench]
extends = env:guition-standalone-blueprint-8
board_build.esp-idf.sdkconfig_path = .pio/build/guition-standalone-blueprint-8-bench/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8;sdkconfig.defaults.bench06

; Isolated 0.7 software candidate. Eight voices; electrical gates stay OFF.
[env:guition-sound-library-8]
extends = env:guition-standalone-blueprint-8
board_build.esp-idf.sdkconfig_path = .pio/build/guition-sound-library-8/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8;sdkconfig.defaults.library07

; Review-only audible candidate for the documented 0.6 bench. No upload authority.
[env:guition-sound-library-8-bench]
extends = env:guition-sound-library-8
board_build.esp-idf.sdkconfig_path = .pio/build/guition-sound-library-8-bench/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8;sdkconfig.defaults.library07;sdkconfig.defaults.bench06

; 0.8 software review only. No change to legacy profiles, USB/I2S gates OFF.
[env:guition-unified-engine-8]
extends = env:guition-sound-library-8
board_build.esp-idf.sdkconfig_path = .pio/build/guition-unified-engine-8/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8;sdkconfig.defaults.library07;sdkconfig.defaults.unified08

; Reviewable audible image for existing50/51/52 + HS0 bench. No upload authority.
[env:guition-unified-engine-8-bench]
extends = env:guition-unified-engine-8
board_build.esp-idf.sdkconfig_path = .pio/build/guition-unified-engine-8-bench/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.es;sdkconfig.defaults.standalone;sdkconfig.defaults.blueprint;sdkconfig.defaults.voices8;sdkconfig.defaults.library07;sdkconfig.defaults.unified08;sdkconfig.defaults.bench06
