[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
upload_port = COM8
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Optional: Depending on exact N16R8 variant, 
; this enables Octal PSRAM and QIO Flash:
board_build.arduino.memory_type = qio_opi 
