[platformio]
src_dir = main
default_envs = esp32-s3-devkitc-1

[env]
; Pin the already-used local platform/IDF; no framework upgrade in phase 2.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
upload_port = COM8
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DAMY_HPF_OUTPUT
    -DAMY_SAMPLE_RATE=48000

; Optional: Depending on exact N16R8 variant, 
; this enables Octal PSRAM and QIO Flash:
board_build.arduino.memory_type = qio_opi 

[env:esp32-s3-devkitc-1]
; Generated sdkconfig stays inside this environment's ignored build directory.
board_build.esp-idf.sdkconfig_path = .pio/build/esp32-s3-devkitc-1/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.esp32-s3-devkitc-1;sdkconfig.defaults.256

[env:esp32-s3-devkitc-1-128]
board_build.esp-idf.sdkconfig_path = .pio/build/esp32-s3-devkitc-1-128/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.esp32-s3-devkitc-1;sdkconfig.defaults.128

[env:esp32-s3-link]
extends = env:esp32-s3-devkitc-1
board_build.esp-idf.sdkconfig_path = .pio/build/esp32-s3-link/sdkconfig
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.esp32-s3-devkitc-1;sdkconfig.defaults.256;sdkconfig.defaults.link
