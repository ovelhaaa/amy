name: SMK-P4 Firmware Build

on:
  push:
    branches: [main]
    paths: ['smk-p4/**', 'smk-s3/**', 'shared/**', 'tests/*smk_link*', 'tests/*smk_touch_note*', '.github/workflows/smk-p4-build.yml']
  pull_request:
    branches: [main]
    paths: ['smk-p4/**', 'smk-s3/**', 'shared/**', 'tests/*smk_link*', 'tests/*smk_touch_note*', '.github/workflows/smk-p4-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol, touch gesture and display geometry regressions
        shell: pwsh
        run: |
          ./tests/run_smk_link.ps1
          ./smk-p4/tests/run_host.ps1
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: smk-p4
            environment: guition-display
          - project: smk-p4
            environment: guition-link
          - project: smk-p4
            environment: guition-standalone
          - project: smk-s3
            environment: esp32-s3-link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Compile controller firmware (no flash)
        run: pio run -d ${{ matrix.project }} -e ${{ matrix.environment }}
      - name: Verify S3 P4 profile actually disables local rendering
        if: matrix.project == 'smk-s3'
        run: python -c "from pathlib import Path; assert '#define CONFIG_SMKS3_P4_HEADLESS 1' in Path('smk-s3/.pio/build/esp32-s3-link/config/sdkconfig.h').read_text()"
      - name: Verify standalone target and safe hardware defaults
        if: matrix.environment == 'guition-standalone'
        run: python smk-p4/tests/check_standalone_build.py
