name: SMK-P4 Firmware Build

on:
  push:
    branches: [main]
    paths: ['smk-p4/**', 'smk-s3/**', 'src/**', 'shared/**', 'tests/*smk_link*', 'tests/*smk_touch_note*', '.github/workflows/smk-p4-build.yml']
  pull_request:
    branches: [main]
    paths: ['smk-p4/**', 'smk-s3/**', 'src/**', 'shared/**', 'tests/*smk_link*', 'tests/*smk_touch_note*', '.github/workflows/smk-p4-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protocol, touch gesture and display geometry regressions
        shell: pwsh
        run: |
          ./tests/run_smk_link.ps1
          ./smk-p4/tests/run_host.ps1
          ./smk-p4/tests/run_usb.ps1
          ./smk-p4/tests/run_retrigger_probe.ps1
          ./smk-p4/tests/run_amy.ps1 -Voices 4 | Tee-Object build/profile4_tests.log
          ./smk-p4/tests/run_amy.ps1 -Voices 6 | Tee-Object build/profile6_tests.log
          ./smk-p4/tests/run_amy.ps1 -Voices 8 | Tee-Object build/profile8_tests.log
          ./smk-p4/tests/run_amy.ps1 -Voices 8 -SoundLibrary
          python smk-p4/tests/audit_patch_library.py --check
          python smk-p4/tests/summarize_polyphony.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: smk-p4
            environment: guition-display
          - project: smk-p4
            environment: guition-link
          - project: smk-p4
            environment: guition-standalone
          - project: smk-p4
            environment: guition-standalone-blueprint
            voices: 4
          - project: smk-p4
            environment: guition-standalone-blueprint-6
            voices: 6
          - project: smk-p4
            environment: guition-standalone-blueprint-8
            voices: 8
          - project: smk-p4
            environment: guition-sound-library-8
            voices: 8
            audit_flags: --sound-library --environment guition-sound-library-8
          - project: smk-s3
            environment: esp32-s3-link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Compile controller firmware (no flash)
        run: pio run -d ${{ matrix.project }} -e ${{ matrix.environment }}
      - name: Verify S3 P4 profile actually disables local rendering
        if: matrix.project == 'smk-s3'
        run: python -c "from pathlib import Path; assert '#define CONFIG_SMKS3_P4_HEADLESS 1' in Path('smk-s3/.pio/build/esp32-s3-link/config/sdkconfig.h').read_text()"
      - name: Verify Blueprint target and safe hardware defaults
        if: startsWith(matrix.environment, 'guition-standalone-blueprint') || matrix.environment == 'guition-sound-library-8'
        run: python smk-p4/tests/check_blueprint_build.py --voices ${{ matrix.voices }} ${{ matrix.audit_flags }}
      - name: Verify standalone target and safe hardware defaults
        if: matrix.environment == 'guition-standalone'
        run: python smk-p4/tests/check_standalone_build.py

  blueprint-live-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - name: Resolve pinned LVGL via existing firmware build
        run: pio run -d smk-p4 -e guition-standalone-blueprint
      - name: Demo regression, live adapter lifecycle and real AMY coexistence
        shell: pwsh
        run: |
          ./smk-p4/ui-preview/run_preview.ps1
          foreach ($voices in @(4, 6, 8)) {
            ./smk-p4/tests/run_amy.ps1 -Voices $voices
            if ($LASTEXITCODE) { throw "AMY profile $voices failed" }
            ./smk-p4/tests/run_blueprint_adapter.ps1 -Voices $voices
            if ($LASTEXITCODE) { throw "UI profile $voices failed" }
          }
          ./smk-p4/tests/run_amy.ps1 -Voices 8 -SoundLibrary
          ./smk-p4/tests/run_blueprint_adapter.ps1 -Voices 8 -SoundLibrary
