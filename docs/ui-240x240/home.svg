<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">SMK-S3 — tela principal 240 por 240</title>
  <desc id="desc">Conceito de tela principal com oito macros em uma matriz quatro por dois, estados USB e MIDI, osciloscópio e informações de performance.</desc>
  <defs>
    <style>
