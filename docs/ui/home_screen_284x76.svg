<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 76" width="852" height="228" shape-rendering="crispEdges">
  <defs>
    <style>
      .txt-mono { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
      .txt-tiny { font-size: 6px; }
      .txt-small { font-size: 7px; }
      .txt-label { font-size: 6px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="284" height="76" fill="#000000"/>

  <!-- ── HEADER STRIP (y=0..13) ── -->
  <rect x="0" y="0" width="284" height="13" fill="#141419"/>
  <line x1="0" y1="13" x2="284" y2="13" stroke="#42424d" stroke-width="1"/>

  <!-- Patch Info -->
  <text x="3" y="9" fill="#ffffff" class="txt-mono txt-small">042 GLASS HORIZON</text>
  <text x="96" y="9" fill="#00e5ff" class="txt-mono txt-small">[POLY]</text>
  <text x="128" y="9" fill="#ffb300" class="txt-mono txt-small">120.0</text>
  <text x="152" y="9" fill="#9e9e9e" class="txt-mono txt-tiny">BPM</text>

  <!-- Mini Scope in Header (x=174..218) -->
  <rect x="174" y="2" width="44" height="9" fill="#0a120a" stroke="#264d26" stroke-width="0.5"/>
  <path d="M 175 6.5 Q 180 3 186 6.5 T 197 6.5 T 208 6.5 T 217 6.5" fill="none" stroke="#00e676" stroke-width="1" shape-rendering="geometricPrecision"/>

  <!-- 8 Polyphony Voices (x=222..258) -->
  <g id="voice-dots">
    <rect x="222" y="4" width="3" height="5" fill="#00e5ff"/>
    <rect x="227" y="4" width="3" height="5" fill="#00e5ff"/>
    <rect x="232" y="4" width="3" height="5" fill="#00e5ff"/>
    <rect x="237" y="4" width="3" height="5" fill="#00e5ff"/>
    <rect x="242" y="4" width="3" height="5" fill="#2a2a33"/>
    <rect x="247" y="4" width="3" height="5" fill="#2a2a33"/>
    <rect x="252" y="4" width="3" height="5" fill="#2a2a33"/>
    <rect x="257" y="4" width="3" height="5" fill="#2a2a33"/>
  </g>

  <!-- USB and MIDI Status (x=263..282) -->
  <text x="263" y="9" fill="#bdbdbd" class="txt-mono txt-tiny">USB</text>
  <circle cx="277" cy="6.5" r="2.5" fill="#00e676" shape-rendering="geometricPrecision"/>

  <!-- ── 8 MACRO CHANNELS (y=14..75, ~35px each) ── -->
  <!-- Subtle column dividing grid lines -->
  <line x1="35" y1="14" x2="35" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="71" y1="14" x2="71" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="106" y1="14" x2="106" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="142" y1="14" x2="142" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="177" y1="14" x2="177" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="213" y1="14" x2="213" y2="76" stroke="#1f1f26" stroke-width="1"/>
  <line x1="248" y1="14" x2="248" y2="76" stroke="#1f1f26" stroke-width="1"/>

  <!-- CHANNEL 1: BRITE (Knob 1) -->
  <g transform="translate(1, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#00e5ff" class="txt-mono txt-label">BRITE</text>
    <!-- Glyph: Lowpass curve -->
    <path d="M 6 17 L 18 17 Q 24 17 28 24" fill="none" stroke="#00e5ff" stroke-width="1" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">78</text>
    <!-- Bar Gauge -->
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="47" width="20" height="10" fill="#00e5ff"/>
  </g>

  <!-- CHANNEL 2: RESO (Knob 2) -->
  <g transform="translate(36, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#00e5ff" class="txt-mono txt-label">RESO</text>
    <!-- Glyph: Resonance peak -->
    <path d="M 6 24 L 16 14 L 20 24 L 28 24" fill="none" stroke="#00e5ff" stroke-width="1" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">42</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="52" width="20" height="5" fill="#00e5ff"/>
  </g>

  <!-- CHANNEL 3: ATK (Knob 3) -->
  <g transform="translate(72, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#00e5ff" class="txt-mono txt-label">ATK</text>
    <!-- Glyph: Attack ramp -->
    <line x1="6" y1="24" x2="28" y2="14" stroke="#00e5ff" stroke-width="1.2" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">12ms</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="55" width="20" height="2" fill="#00e5ff"/>
  </g>

  <!-- CHANNEL 4: REL (Knob 4) -->
  <g transform="translate(107, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#00e5ff" class="txt-mono txt-label">REL</text>
    <!-- Glyph: Exponential Release -->
    <path d="M 6 14 Q 14 24 28 24" fill="none" stroke="#00e5ff" stroke-width="1" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">640m</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="45" width="20" height="12" fill="#00e5ff"/>
  </g>

  <!-- CHANNEL 5: CHOR (Knob 5) -->
  <g transform="translate(143, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#ffb300" class="txt-mono txt-label">CHOR</text>
    <!-- Glyph: Modulated wave -->
    <path d="M 6 19 Q 11 14 17 19 T 28 19" fill="none" stroke="#ffb300" stroke-width="1" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">35%</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="51" width="20" height="6" fill="#ffb300"/>
  </g>

  <!-- CHANNEL 6: DLY-T (Knob 6) -->
  <g transform="translate(178, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#ffb300" class="txt-mono txt-label">DLY-T</text>
    <!-- Glyph: Delay tap spikes -->
    <line x1="8" y1="24" x2="8" y2="14" stroke="#ffb300" stroke-width="1.5"/>
    <line x1="16" y1="24" x2="16" y2="18" stroke="#ffb300" stroke-width="1.2"/>
    <line x1="24" y1="24" x2="24" y2="21" stroke="#ffb300" stroke-width="1"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">1/8d</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="47" width="20" height="10" fill="#ffb300"/>
  </g>

  <!-- CHANNEL 7: REVB (Knob 7) -->
  <g transform="translate(214, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#ffb300" class="txt-mono txt-label">REVB</text>
    <!-- Glyph: Reverb diffusion cloud dots -->
    <g fill="#ffb300">
      <circle cx="9" cy="18" r="1.5" shape-rendering="geometricPrecision"/>
      <circle cx="15" cy="15" r="1.2" shape-rendering="geometricPrecision"/>
      <circle cx="21" cy="20" r="1" shape-rendering="geometricPrecision"/>
      <circle cx="25" cy="16" r="0.8" shape-rendering="geometricPrecision"/>
    </g>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">50%</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="48" width="20" height="9" fill="#ffb300"/>
  </g>

  <!-- CHANNEL 8: DRV (Knob 8) -->
  <g transform="translate(249, 15)">
    <text x="17" y="7" text-anchor="middle" fill="#ff3344" class="txt-mono txt-label">DRV</text>
    <!-- Glyph: S-curve Saturation -->
    <path d="M 6 24 C 14 24 16 14 28 14" fill="none" stroke="#ff3344" stroke-width="1.2" shape-rendering="geometricPrecision"/>
    <text x="17" y="34" text-anchor="middle" fill="#ffffff" class="txt-mono txt-small">+6dB</text>
    <rect x="6" y="39" width="22" height="19" fill="#141419" stroke="#42424d" stroke-width="1"/>
    <rect x="7" y="50" width="20" height="7" fill="#ff3344"/>
  </g>

</svg>
